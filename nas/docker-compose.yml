services:
  tvbox-manager:
    build:
      context: ..
      dockerfile: nas/Dockerfile
    platform: linux/amd64
    container_name: tvbox-manager
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      TZ: Asia/Shanghai
      TVBOX_INTERVAL_HOURS: "12"
      MEDIA_PROBE_LIMIT: "40"
      PROBE_QUOTA: "160"
      TVBOX_AUTO_RUN: "1"
      TVBOX_FIRST_RUN_DELAY: "120"
    volumes:
      - ./data:/data
      - ./output:/output
      - ./config:/config
      - ./logs:/logs
