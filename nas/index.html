<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVBox NAS Manager</title><style>body{font:15px system-ui;max-width:920px;margin:40px auto;padding:0 18px;color:#222}button,input{padding:9px;margin:4px}input{width:min(620px,75%)}button:disabled{opacity:.55;cursor:not-allowed}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}code{word-break:break-all}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.muted{color:#666}</style><h1>TVBox NAS Manager</h1><div class="card"><b>状态</b><p id="status">加载中…</p><p id="auto" class="muted"></p><button id="runBtn" onclick="run()">立即维护</button></div><div class="card"><b>运行日志</b><pre id="log" style="max-height:320px;overflow:auto;white-space:pre-wrap;background:#f6f6f6;padding:10px;border-radius:8px">暂无</pre></div><div class="card"><b>订阅地址</b><p><code id="sub"></code></p><p id="subState" class="muted"></p></div><div class="card"><b>添加上游</b><p><input id="url" placeholder="https://..."><button onclick="add()">添加</button></p></div><div class="card"><b>手工上游</b><table><thead><tr><th>名称</th><th>地址</th><th>来源</th></tr></thead><tbody id="ups"></tbody></table></div><script>
const $=x=>document.getElementById(x); $("sub").textContent=location.origin+"/tvbox.json";
async function refresh(){
  let s=await fetch("/api/status").then(r=>r.json());
  $("runBtn").disabled=!!s.running;
  if(s.running) $("status").textContent="维护中："+(s.step||"准备中…");
  else if(s.last_run) $("status").textContent="上次："+s.last_run.finished+" / "+(s.last_run.ok?"成功":"失败")+" / "+s.last_run.message;
  else $("status").textContent="尚未运行";
  if(s.auto_run){
    $("auto").textContent=s.next_auto_in!=null?("自动维护已开启，约 "+s.next_auto_in+" 秒后执行下一次。"):"自动维护已开启。";
  } else $("auto").textContent="自动维护已关闭。";
  $("subState").textContent=s.subscription_ready?"订阅已就绪；维护失败时会继续保留上一版可用订阅。":"首次自动维护成功后订阅可用，无需手动点击。";
  let l=await fetch("/api/log").then(r=>r.json());$("log").textContent=l.text||"暂无运行日志";
  let u=await fetch("/api/upstreams").then(r=>r.json());$("ups").innerHTML=u.map(x=>'<tr><td>'+esc(x.name)+'</td><td><code>'+esc(x.url)+'</code></td><td>'+esc(x.source)+'</td></tr>').join("")
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function add(){let url=$("url").value.trim();if(!url)return;let r=await fetch("/api/upstreams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});if(!r.ok)alert((await r.json()).error);$("url").value="";refresh()}
async function run(){let r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});if(!r.ok){let d=await r.json();alert(d.error||"启动失败")}refresh()} refresh();setInterval(refresh,3000);
</script></html>
